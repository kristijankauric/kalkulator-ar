<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content='width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes'>
    <title>Digitron db801 AR kalkulator</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="stylesheet" href="TemplateData/navigation.css">
</head>
<body>
    <!-- Place button -->
     <div id="place-button" class="ui-button d-none" onclick="placeOrigin()">Postavi u prostor</div>
    <!-- Reset button -->
     <div id="reset-button" class="ui-button d-none" onclick="resetOrigin()">Resetiraj</div>
     
    <video id="webcam-video" muted autoplay playsinline></video>
    <canvas id="video-canvas"></canvas>
    <div id="startARDiv" class="title-menu">
        <!-- <select id="chooseCamSel" style="display: none;" onchange="SelectCam()"></select> -->
        <p class="text">Za uživanje u AR sadržajima, molimo dozvolite pristup vašoj kameri.</p>
        <button id="startARButton" class="d-none" onclick="StartAR()">ODOBRI KAMERU</button>
    </div>
    
    <div id="screenshotDiv" style="display: none;" class="ctaDiv">
        <div style="position:relative; background-color:white; padding:10px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3), 0 6px 20px 0 rgba(0, 0, 0, 0.25);">
            <img id="screenshotImg" src="" alt="screenshot" style="width:80vw; height:80vh">
            <button onclick="document.getElementById('screenshotDiv').style.display = 'none';" style="position:absolute; transform:translateY(-100%); right:0; top:0">Close</button>
        </div>
    </div>

    <div id="errorDiv" class="ctaDiv">
        <p id="errorText"></p>
    </div>

    <div id="unity-container" class="unity-mobile">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>


    <script src="arcamera.js" type="text/javascript"></script>
    <script src="wtracker.js" type="text/javascript"></script>
    <script src="Build/docs.loader.js"></script>
    <script>
        const APP_BUILD_VERSION = '0.33';
        const _modeOverride = new URLSearchParams(window.location.search).get('mode');
        const isDesktopPreview = _modeOverride === 'desktop' ? true
            : _modeOverride === 'mobile' ? false
            : !(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent));
        window.__DIGITRON_DESKTOP_PREVIEW = isDesktopPreview;
        // Mode toggle button (for testing)
        (function() {
            const btn = document.createElement('button');
            btn.id = 'debug-mode-btn';
            btn.textContent = isDesktopPreview ? 'Mode: Desktop' : 'Mode: Mobile';
            btn.style.cssText = 'position:fixed;bottom:10px;right:10px;z-index:9999;padding:6px 10px;font-size:11px;opacity:0.75;background:#222;color:#fff;border:none;border-radius:4px;cursor:pointer;';
            btn.onclick = function() {
                const p = new URLSearchParams(window.location.search);
                p.set('mode', isDesktopPreview ? 'mobile' : 'desktop');
                window.location.search = p.toString();
            };
            document.addEventListener('DOMContentLoaded', function() { document.body.appendChild(btn); });
        })();
        // Build version badge (always visible, small text at bottom)
        (function() {
            const version = document.createElement('div');
            version.id = 'build-version-badge';
            version.textContent = 'v' + APP_BUILD_VERSION;
            version.style.cssText = 'position:fixed;bottom:10px;left:10px;z-index:9999;padding:2px 6px;font-size:10px;letter-spacing:0.2px;opacity:0.72;background:rgba(0,0,0,0.45);color:#fff;border-radius:3px;pointer-events:none;';
            document.addEventListener('DOMContentLoaded', function() { document.body.appendChild(version); });
        })();
        // Tracking debug overlay (for diagnosing world tracking stability on real devices)
        (function() {
            const panel = document.createElement('div');
            panel.id = 'tracking-debug-overlay';
            panel.style.cssText = 'position:fixed;top:10px;left:10px;z-index:10000;padding:6px 8px;max-width:72vw;font-size:10px;line-height:1.35;letter-spacing:0.1px;white-space:pre-line;opacity:0.84;background:rgba(8,12,16,0.74);color:#dff6ff;border:1px solid rgba(140,200,220,0.35);border-radius:5px;pointer-events:none;';

            function boolText(v) { return v ? 'yes' : 'no'; }
            function formatNumber(v, digits) {
                if (typeof v !== 'number' || !isFinite(v)) return '-';
                return v.toFixed(digits || 0);
            }

            function refreshOverlay() {
                const wt = window.wTracker;
                const ac = window.arCamera;
                const now = Date.now();
                const modeLabel = isDesktopPreview ? 'desktop-preview' : 'mobile-webar';
                const wtMode = wt && wt.MODE ? wt.MODE : '-';
                const wtState = wt && wt.state ? wt.state : '-';
                const wtStarted = wt ? boolText(!!wt.isStarted) : '-';
                const camStarted = ac ? boolText(!!ac.isCameraStarted) : '-';
                const camPaused = ac ? boolText(!!ac.cameraPaused) : '-';
                const fps = wt && typeof wt.fps === 'number' ? formatNumber(wt.fps, 1) : '-';
                const errors = wt && typeof wt.MAX_ERRORS === 'number' ? wt.MAX_ERRORS : '-';
                const drift = wt && typeof wt.driftCounter === 'number' ? wt.driftCounter : '-';
                const lastUpdate = wt && typeof wt.lastUpdateTime === 'number'
                    ? Math.max(0, now - wt.lastUpdateTime)
                    : null;
                const updateAge = lastUpdate == null ? '-' : (lastUpdate + 'ms');

                panel.textContent =
                    'Tracking Debug\n' +
                    'build: v' + APP_BUILD_VERSION + '\n' +
                    'runtime: ' + modeLabel + '\n' +
                    'tracker.mode: ' + wtMode + '\n' +
                    'tracker.state: ' + wtState + '\n' +
                    'tracker.started: ' + wtStarted + '\n' +
                    'camera.started: ' + camStarted + '\n' +
                    'camera.paused: ' + camPaused + '\n' +
                    'fps: ' + fps + '\n' +
                    'lastUpdateAge: ' + updateAge + '\n' +
                    'driftCounter: ' + drift + '\n' +
                    'maxErrors: ' + errors;
            }

            document.addEventListener('DOMContentLoaded', function() {
                document.body.appendChild(panel);
                refreshOverlay();
                setInterval(refreshOverlay, 400);
            });
        })();
        let hasStartedUnity = false;

        function getOpenCvCandidates() {
            const candidates = [];
            const add = (url) => {
                if (!url) return;
                if (candidates.indexOf(url) >= 0) return;
                candidates.push(url);
            };

            const baseHref = window.location.href.split('#')[0];
            add(new URL('opencv.js', baseHref).href);
            add(window.location.origin + '/opencv.js');

            // Fallback for project-pages style paths (e.g. /repo-name/index.html).
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            if (pathParts.length > 0) {
                add(window.location.origin + '/' + pathParts[0] + '/opencv.js');
            }

            return candidates;
        }

        async function initializeWorldTrackerWithFallback() {
            const candidates = getOpenCvCandidates();
            const failures = [];

            for (const candidate of candidates) {
                for (let attempt = 1; attempt <= 2; attempt++) {
                    try {
                        await wTracker.initialize(candidate);
                        console.log('World tracker initialized with', candidate, 'attempt', attempt);
                        return;
                    } catch (error) {
                        const errorText = (error && (error.message || error.toString())) || 'unknown-error';
                        failures.push(candidate + ' [attempt ' + attempt + ']: ' + errorText);
                    }
                }
            }

            throw new Error('OpenCV load failed. Tried:\n' + failures.join('\n'));
        }

        function startUnityRuntime() {
            if (hasStartedUnity) return;
            hasStartedUnity = true;

            const runtimeCanvas = document.querySelector("#unity-canvas");
            const runtimeLoadingBar = document.querySelector("#unity-loading-bar");
            const runtimeProgressBarFull = document.querySelector("#unity-progress-bar-full");

            runtimeCanvas.style.width = window.innerWidth + "px";
            runtimeCanvas.style.height = window.innerHeight + "px";
            document.getElementById('startARDiv').style.display = 'none';
            runtimeLoadingBar.style.display = "block";

            createUnityInstance(runtimeCanvas, {
                    dataUrl: "Build/docs.data",
                    frameworkUrl: "Build/docs.framework.js",
                    codeUrl: "Build/docs.wasm",
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "Brojka Kreativnih Produkcija",
                    productName: "Digitron db801 AR kalkulator",
                    productVersion: APP_BUILD_VERSION,
                    },
                    (progress) => {
                        runtimeProgressBarFull.style.width = 100 * progress + "%";
                    }
                ).then((unityInstance) => {
                window.unityInstance = unityInstance;
                if (!isDesktopPreview) {
                    RequestWebcam();
                    StartMotionSensors();
                }
                runtimeLoadingBar.style.display = "none";
            });
        }

        var initialize = async() =>{
            var unityCanvas = document.querySelector("#unity-canvas");
            var videoCanvas = document.querySelector("#video-canvas");
            window.arCamera = new ARCamera(unityCanvas, videoCanvas);
            window.wTracker = new WorldTracker(arCamera);

            if (isDesktopPreview) {
                startUnityRuntime();
                return;
            }

            try{
                await initializeWorldTrackerWithFallback();
                console.log("World tracker initialized!");   
            }
            catch (error) {
                console.error("Failed to initialize world tracker. Are you missing opencv.js?", error);
                const errorText = (error && (error.message || error.toString())) || 'unknown-error';
                ShowError("Failed to initialize the World Tracker.\n" + errorText);
                return;
            }

            await LoadWebcams();
            document.getElementById("startARButton").classList.remove('d-none');
        }

        initialize();

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        function StartAR() {
            startUnityRuntime();
        }

        //Set Facing Mode here ('environment', 'user', '')
		window.unityFacingMode = "environment"

        window.WEBCAM_SETTINGS = {
            video: {
                facingMode: unityFacingMode,
            },
            audio: false
        };
        window.requestingForCameraPermission = false;
        async function RequestWebcam(){
            window.requestingForCameraPermission = true;
            try{
                window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                arCamera.setFlipped(window.WEBCAM_SETTINGS.video.facingMode == 'user');
                
                // console.log("Webcam access granted");
                requestingForCameraPermission = false;
            }
            catch (err) {
                //user denied camera permission - show error panel
                console.error("getUserMedia error - " , err);
                ShowError("Failed to start the experience. Camera permission was denied");
                window.requestingForCameraPermission = false;
            }           
        }
        async function StartWebcam(){
            // console.log("StartWebcam")

            while (window.requestingForCameraPermission) {
                // Wait until requestingForCameraPermission becomes true.
                console.log("Waiting for permissions...");
                await new Promise(resolve => setTimeout(resolve, 100)); // Adjust the delay time as needed.
            }

            // console.log("Got Permissions");

            if(window.webcamStream)
            {
                const video = document.querySelector("#webcam-video");
                video.srcObject = webcamStream;
                try {
                    await arCamera.startWebcam(video);
                    // console.log("Webcam started successfully");

                    window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamSuccess');
                }
                catch(err){
                    console.error("Webcam failed to start - ", err);
                    window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
                }   
            }
            else{
                console.error("Webcam failed to start - permission not yet granted");
                window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
            }  
        }

        async function LoadWebcams(){
            let camDevices = [];
            let devices = await navigator.mediaDevices.enumerateDevices();
            var ctr = 0;
            devices.forEach(mediaDevice => {
                if (mediaDevice.kind === 'videoinput') {

                    if(window.unityFacingMode == 'environment' && !mediaDevice.label.includes('facing front')){
                        //back cam only
                        camDevices.push(mediaDevice);
                    }
                    else if(window.unityFacingMode == 'user' && mediaDevice.label.includes('facing front')){
                        //front cam only
                        camDevices.push(mediaDevice);
                    }
                    else{
                        //back and front
                        camDevices.push(mediaDevice);
                        console.log('pushed', mediaDevice);
                    }   
                    
                    ctr++;
                }
            });
            var select = document.getElementById("chooseCamSel");

            // Remove this line and uncomment the element "chooseCamSel" 
            // if you want to allow the selection of camera options
            if (!select) return; 

            select.style.display = "block";
            var count = 0;
            //reverse array because some Android phones can't distinguish front and back cams at first load
            //and when this happens, most of the time, front cam goes first and back cam goes last
            camDevices = camDevices.reverse();
            camDevices.forEach(mediaDevice => {
                const option = document.createElement('option');
                option.value = mediaDevice.deviceId;
                let label = `Camera ${count}`;
                if (mediaDevice.label) {
                    label = mediaDevice.label
                }
                const textNode = document.createTextNode(label);
                option.appendChild(textNode);
                select.appendChild(option);
                count++;
            });
            wTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
        }
        function SelectCam(){
            var select = document.getElementById("chooseCamSel");
            window.deviceId = select.value;
            window.WEBCAM_SETTINGS.video['deviceId'] = deviceId;
            //console.log(window.WEBCAM_SETTINGS);
            wTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
        }

        async function FlipCam(){
            arCamera.stopWebcam();
            window.WEBCAM_SETTINGS.video.deviceId = '';

            if(window.WEBCAM_SETTINGS.video.facingMode == 'user'){
                 window.WEBCAM_SETTINGS.video.facingMode = 'environment';
                arCamera.setFlipped(false);
            }
            else{
                window.WEBCAM_SETTINGS.video.facingMode = 'user';
                arCamera.setFlipped(true);
            }
            window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);

            const video = document.querySelector("#webcam-video");
            video.srcObject = webcamStream;

            await arCamera.startWebcam(video);
        }

        function StartMotionSensors(){
            window.wTracker.startAngles()
            .then(()=>{
                console.log("Motion sensors started");
            })
            .catch(error=>{
                console.error("Failed to start motion sensors - " + error);
                ShowError("Failed to start the experience. " + error);

            });
        }

        function StartGPS(){            
            window.wTracker.startGPS()
            .then((pos)=>{
                // console.log("GPS started", pos);
            })
            .catch(error=>{
                console.error("Failed to start GPS - " + error);
                //ShowError("Failed to start GPS " + error);
            });
        }
        

        function ShowError(error){
            document.getElementById("errorDiv").style.display = "flex";
            document.getElementById("errorText").innerHTML = error;
        }

        function ShowScreenshot(dataUrl){
            document.getElementById("screenshotDiv").style.display = "flex";
            document.getElementById("screenshotImg").src = dataUrl;
            document.getElementById("screenshotImg").style.width = "80vw";
            document.getElementById("screenshotImg").style.height = 80 / window.innerWidth * window.innerHeight + "vw";
        }
        
    </script>
    <script src="navigation.js"></script>
</body>
</html>
